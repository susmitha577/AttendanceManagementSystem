<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
</head>
<body bgcolor="lightpink">
<h2 align="center">Student Registration Form</h2>
<form action="Student.jsp">
<table border="1" cellpadding="10" width= "50%" height="50%" align="center" bgcolor="lightgreen">
<tr>
<td>Full Name</td>
<td><input type="text" name="name"></td>
</tr>
<tr>
<td>Father Name</td>
<td><input type="text" name="father"></td>
</tr>

<tr>
<td>Email</td>
<td><input type="email" name="email"></td>
</tr>

<tr>
<td>Phone Number</td>
<td><input type="tel" name="phone"></td>
</tr>

<tr>
<td>Date of Birth</td>
<td><input type="date" name="dob"></td>
</tr>
<tr>
<td>Branch</td>
<td>
<select name="branch">
<option>CSE</option>
<option>ECE</option>
<option>EEE</option>
<option>Mechanical</option>
<option>Civil</option>
<option>IT</option>
</select>
</td>
</tr>
<tr>
<td>Address</td>
<td>
<textarea rows="4" cols="25"></textarea>
</td>
</tr>
<tr>
<td colspan="2" align="center">
<input type="submit" value="Register">
<input type="reset" value="Clear">
</td>
</tr>

</table>

</form>

</center>

</body>
</html>
